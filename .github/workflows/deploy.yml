name: Deploy website to Cloudflare Workers

env:
  WC_HUGO_VERSION: '0.152.1'
  NODE_VERSION: '20'

on:
  # Trigger the workflow every time you push to the `main` branch
  push:
    branches: ['main']
  # Allows you to run this workflow manually from the Actions tab on GitHub
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'deploy'
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository_owner != 'HugoBlox'
    runs-on: ubuntu-latest
    environment:
      name: cloudflare
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
          # Fetch history for Hugo's .GitInfo and .Lastmod
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Setup pnpm
      if: hashFiles('package.json') != ''
      uses: pnpm/action-setup@v4

    - name: Install dependencies
      run: |
        # Install Tailwind CLI if package.json exists
        if [ -f "package.json" ]; then
          echo "Installing Tailwind dependencies..."
          pnpm install || npm install
        fi

    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v3
      with:
        hugo-version: ${{ env.WC_HUGO_VERSION }}
        extended: true

      # Cache dependencies (Go modules, node_modules) - stable, rarely changes
    - uses: actions/cache@v4
      with:
        path: |
          /tmp/hugo_cache_runner/
          node_modules/
          modules/*/node_modules/
        key: ${{ runner.os }}-hugo-deps-${{ hashFiles('**/go.mod', '**/package-lock.json',
          '**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-hugo-deps-

      # Cache Hugo resources (processed images, CSS) - invalidates only when assets/config change
    - uses: actions/cache@v4
      with:
        path: resources/
        key: ${{ runner.os }}-hugo-resources-${{ hashFiles('assets/**/*', 'config/**/*',
          'hugo.yaml', 'package.json') }}
        restore-keys: |
          ${{ runner.os }}-hugo-resources-

      # baseURL comes from config/_default/hugo.yaml (https://tuanla.vn/)
    - name: Build with Hugo
      env:
        HUGO_ENVIRONMENT: production
        HUGO_ENV: production
        HUGO_ENABLEGITINFO: 'true'
      run: |
        echo "Hugo Cache Dir: $(hugo config | grep cachedir)"
        hugo --gc --minify

    - name: Generate Pagefind search index
      run: pnpm dlx pagefind --site public

      # Uploads ./public as static assets, per wrangler.jsonc
    - name: Deploy to Cloudflare Workers
      id: deploy
      uses: cloudflare/wrangler-action@v4
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
